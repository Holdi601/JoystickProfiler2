# Posts every published JoyPro release (its release notes and the download link) to a Discord channel.
# Needs the repository secret DISCORD_WEBHOOK_URL (Discord: channel settings > Integrations > Webhooks > New Webhook >
# Copy Webhook URL; GitHub: Settings > Secrets and variables > Actions > New repository secret). Without the secret the
# job does nothing. Only app versions (tags starting with "v") are announced; picture and 3D packs are not.
name: Discord release notice

on:
  release:
    types: [published]

jobs:
  notify:
    if: ${{ startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Post the release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK_URL secret: nothing posted."
            exit 0
          fi
          # Discord allows 4096 characters in an embed description: longer notes end with a pointer to the release page.
          DESC=$(printf '%s' "$BODY" | head -c 3800)
          if [ "${#BODY}" -gt 3800 ]; then
            DESC="$DESC

          ... the full notes are on the release page."
          fi
          TITLE="${NAME:-JoyPro $TAG}"
          jq -n --arg title "$TITLE" --arg url "$URL" --arg desc "$DESC" --arg tag "$TAG" '{
            username: "JoyPro",
            content: ("**JoyPro " + $tag + " is out!** Update from inside JoyPro (Settings > About > Check for updates) or download it here: " + $url),
            embeds: [{ title: $title, url: $url, description: $desc, color: 3447003 }]
          }' > payload.json
          curl -sS --fail -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
