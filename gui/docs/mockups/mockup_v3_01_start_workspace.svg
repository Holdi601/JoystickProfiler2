<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#F4F6FA"/>

  <rect x="24" y="20" width="1392" height="96" rx="18" fill="#0F172A"/>
  <text x="56" y="66" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="30" font-weight="700">JoyPro Start</text>
  <text x="56" y="92" fill="#CBD5E1" font-family="Bahnschrift, Segoe UI, Arial" font-size="16">Start here: New, Open, or Import. Import auto-creates a profile if none is open.</text>

  <rect x="24" y="136" width="1392" height="740" rx="16" fill="#FFFFFF"/>
  <text x="56" y="180" fill="#0F172A" font-family="Bahnschrift, Segoe UI, Arial" font-size="24" font-weight="700">Step 1: Choose workspace action</text>

  <rect x="56" y="210" width="420" height="200" rx="14" fill="#EEF2FF"/>
  <text x="86" y="246" fill="#1E293B" font-family="Bahnschrift, Segoe UI, Arial" font-size="22" font-weight="700">New Profile</text>
  <text x="86" y="278" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">Create an empty .pr0file and start from scratch.</text>
  <text x="86" y="302" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">Useful for first-time setup.</text>
  <rect x="86" y="330" width="170" height="44" rx="10" fill="#16A34A"/>
  <text x="137" y="358" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="15" font-weight="700">Create New</text>

  <rect x="510" y="210" width="420" height="200" rx="14" fill="#F8FAFC"/>
  <text x="540" y="246" fill="#0F172A" font-family="Bahnschrift, Segoe UI, Arial" font-size="22" font-weight="700">Open Profile</text>
  <text x="540" y="278" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">Load existing .pr0file and continue work.</text>
  <text x="540" y="302" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">Supports compare and merge after loading.</text>
  <rect x="540" y="330" width="170" height="44" rx="10" fill="#111827"/>
  <text x="592" y="358" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="15" font-weight="700">Open File</text>

  <rect x="964" y="210" width="420" height="200" rx="14" fill="#E0F2FE"/>
  <text x="994" y="246" fill="#0369A1" font-family="Bahnschrift, Segoe UI, Arial" font-size="22" font-weight="700">Import From Game</text>
  <text x="994" y="278" fill="#0E7490" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">Import from DCS or IL2 with filters.</text>
  <text x="994" y="302" fill="#0E7490" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">If no profile is open, JoyPro creates one automatically.</text>
  <rect x="994" y="330" width="220" height="44" rx="10" fill="#0EA5E9"/>
  <text x="1056" y="358" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="15" font-weight="700">Import Wizard</text>

  <rect x="56" y="442" width="1328" height="176" rx="14" fill="#F8FAFC"/>
  <text x="86" y="478" fill="#0F172A" font-family="Bahnschrift, Segoe UI, Arial" font-size="20" font-weight="700">Beginner guide (always visible)</text>
  <text x="86" y="508" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">1) Create or open profile</text>
  <text x="86" y="532" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">2) Import data from game</text>
  <text x="86" y="556" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">3) Edit relations</text>
  <text x="86" y="580" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">4) Connect binds</text>
  <text x="460" y="508" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">5) Optional visual layout assign</text>
  <text x="460" y="532" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">6) Validate and correct warnings</text>
  <text x="460" y="556" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">7) Export to game</text>
  <text x="460" y="580" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">8) Use settings and maintenance tools</text>

  <rect x="56" y="646" width="1328" height="210" rx="14" fill="#0B1220"/>
  <text x="86" y="684" fill="#E2E8F0" font-family="Bahnschrift, Segoe UI, Arial" font-size="20" font-weight="700">Current session summary</text>
  <text x="86" y="714" fill="#A5B4FC" font-family="Consolas, Courier New, monospace" font-size="13">Profile: not loaded</text>
  <text x="86" y="736" fill="#E2E8F0" font-family="Consolas, Courier New, monospace" font-size="13">Last action: none</text>
  <text x="86" y="758" fill="#E2E8F0" font-family="Consolas, Courier New, monospace" font-size="13">Next suggested action: Import Wizard</text>
  <rect x="86" y="786" width="210" height="42" rx="10" fill="#0EA5E9"/>
  <text x="147" y="813" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="15" font-weight="700">Start guided flow</text>
</svg>
