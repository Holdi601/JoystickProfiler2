<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#F4F6FA"/>

  <rect x="20" y="16" width="1400" height="94" rx="18" fill="#0F172A"/>
  <text x="48" y="54" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="28" font-weight="700">Step 3: Bind Studio</text>
  <text x="48" y="79" fill="#CBD5E1" font-family="Bahnschrift, Segoe UI, Arial" font-size="15">Assign physical inputs to relations. Open Visual Assign switches this bind view between table mode and visual mode.</text>
  <rect x="610" y="34" width="78" height="32" rx="8" fill="#334155"/><text x="634" y="54" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">New</text>
  <rect x="694" y="34" width="78" height="32" rx="8" fill="#334155"/><text x="718" y="54" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Open</text>
  <rect x="778" y="34" width="88" height="32" rx="8" fill="#0284C7"/><text x="806" y="54" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Import</text>
  <rect x="872" y="34" width="122" height="32" rx="8" fill="#111827"/><text x="900" y="54" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Save Profile</text>
  <rect x="1000" y="34" width="132" height="32" rx="8" fill="#475569"/><text x="1032" y="54" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Merge Profile</text>
  <rect x="1138" y="34" width="170" height="32" rx="8" fill="#16A34A"/><text x="1170" y="54" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Open Visual Assign</text>
  <rect x="1314" y="34" width="96" height="32" rx="8" fill="#0EA5E9"/><text x="1332" y="54" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Theme</text>
  <text x="980" y="84" fill="#94A3B8" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">Global modifier library and per-bind attachments are managed in this stage.</text>

  <rect x="20" y="124" width="430" height="718" rx="16" fill="#FFFFFF"/>
  <text x="46" y="162" fill="#0F172A" font-family="Bahnschrift, Segoe UI, Arial" font-size="22" font-weight="700">Relations needing binds</text>
  <text x="46" y="189" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Search</text>
  <rect x="46" y="196" width="236" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="60" y="218" fill="#64748B" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">relation, plane, input</text>
  <text x="292" y="189" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Device filter</text>
  <rect x="292" y="196" width="136" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="306" y="218" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">All devices</text>

  <text x="46" y="252" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Group filter (multi-select)</text>
  <rect x="46" y="260" width="382" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="60" y="274" width="94" height="24" rx="12" fill="#0EA5E9"/><text x="84" y="290" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="11" font-weight="700">Braking</text>
  <rect x="162" y="274" width="84" height="24" rx="12" fill="#E2E8F0"/><text x="186" y="290" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">Flight</text>
  <rect x="254" y="274" width="100" height="24" rx="12" fill="#E2E8F0"/><text x="279" y="290" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">Ground Ops</text>

  <rect x="46" y="332" width="382" height="52" rx="9" fill="#E0F2FE"/>
  <text x="62" y="358" fill="#0369A1" font-family="Bahnschrift, Segoe UI, Arial" font-size="15" font-weight="700">Wheel Brake</text>
  <rect x="288" y="342" width="74" height="18" rx="9" fill="#0284C7"/><text x="307" y="355" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="10" font-weight="700">Braking</text>
  <rect x="368" y="342" width="48" height="18" rx="9" fill="#1D4ED8"/><text x="381" y="355" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="10" font-weight="700">ABS</text>

  <rect x="46" y="390" width="382" height="52" rx="9" fill="#F8FAFC"/>
  <text x="62" y="416" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="15">Air Brake Toggle</text>
  <rect x="324" y="400" width="92" height="18" rx="9" fill="#64748B"/><text x="350" y="413" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="10">Ground Ops</text>

  <rect x="46" y="456" width="382" height="52" rx="12" fill="#EEF2FF"/>
  <text x="64" y="487" fill="#1E293B" font-family="Bahnschrift, Segoe UI, Arial" font-size="15" font-weight="700">Quick bind actions</text>
  <text x="238" y="487" fill="#64748B" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">collapsed by default</text>
  <rect x="390" y="470" width="22" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="397" y="485" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">v</text>

  <rect x="46" y="520" width="382" height="52" rx="12" fill="#0B1220"/>
  <text x="64" y="551" fill="#E2E8F0" font-family="Bahnschrift, Segoe UI, Arial" font-size="15" font-weight="700">Modifier Library (profile-wide)</text>
  <text x="256" y="551" fill="#94A3B8" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">collapsed by default</text>
  <rect x="390" y="534" width="22" height="22" rx="6" fill="#111827" stroke="#334155"/><text x="397" y="549" fill="#E2E8F0" font-family="Consolas, Courier New, monospace" font-size="12">v</text>
  <text x="64" y="586" fill="#64748B" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Use expand only when you need batch bind actions or modifier management.</text>

  <rect x="466" y="124" width="954" height="718" rx="16" fill="#FFFFFF"/>
  <text x="492" y="162" fill="#0F172A" font-family="Bahnschrift, Segoe UI, Arial" font-size="22" font-weight="700">Bind Editor</text>

  <rect x="492" y="182" width="902" height="178" rx="12" fill="#F8FAFC"/>
  <text x="510" y="210" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="13">Relation</text>
  <rect x="566" y="196" width="186" height="32" rx="8" fill="#E0F2FE"/><text x="619" y="217" fill="#0369A1" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Wheel Brake</text>
  <text x="766" y="210" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="13">Device</text>
  <rect x="814" y="196" width="252" height="32" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="828" y="217" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">LEFT VPC Throttle MT-50 CM</text>
  <text x="1080" y="210" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="13">Input</text>
  <rect x="1118" y="196" width="106" height="32" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1150" y="217" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">JOY_Z</text>
  <rect x="1232" y="196" width="76" height="32" rx="8" fill="#16A34A"/><text x="1249" y="217" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Record</text>
  <text x="510" y="248" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Format: dcs    Double tap: false    Record threshold: axis over 30 percent</text>
  <text x="510" y="280" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Visual Assign mode toggles this page to joystick tabs with positioned dropdowns at each layout anchor.</text>

  <text x="510" y="312" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Attached modifiers (for this bind)</text>
  <rect x="704" y="296" width="676" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="720" y="310" width="104" height="22" rx="11" fill="#111827"/><text x="744" y="325" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">ShiftLayer</text>
  <rect x="832" y="310" width="114" height="22" rx="11" fill="#111827"/><text x="855" y="325" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">LandingMode</text>
  <rect x="954" y="310" width="106" height="22" rx="11" fill="#E2E8F0"/><text x="980" y="325" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">Add from lib</text>
  <rect x="1068" y="310" width="92" height="22" rx="11" fill="#E2E8F0"/><text x="1089" y="325" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">Detach</text>
  <rect x="1168" y="310" width="98" height="22" rx="11" fill="#E2E8F0"/><text x="1192" y="325" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">Reorder</text>
  <text x="1276" y="325" fill="#64748B" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">mode: ALL</text>

  <rect x="492" y="372" width="902" height="210" rx="12" fill="#EEF2FF"/>
  <text x="510" y="398" fill="#1E293B" font-family="Bahnschrift, Segoe UI, Arial" font-size="16" font-weight="700">Axis and behavior values (editable)</text>
  <text x="510" y="422" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="13">Curvature mode</text>
  <rect x="610" y="406" width="100" height="28" rx="8" fill="#0EA5E9"/><text x="639" y="424" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Single</text>
  <rect x="718" y="406" width="124" height="28" rx="8" fill="#CBD5E1"/><text x="758" y="424" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Multi-point</text>
  <text x="510" y="454" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Curvature</text>
  <rect x="578" y="438" width="58" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="599" y="457" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">20</text>
  <text x="650" y="454" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Deadzone</text>
  <rect x="718" y="438" width="58" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="741" y="457" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">2</text>
  <text x="790" y="454" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Saturation X</text>
  <rect x="872" y="438" width="58" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="891" y="457" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">100</text>
  <text x="944" y="454" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Saturation Y</text>
  <rect x="1026" y="438" width="58" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1045" y="457" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">100</text>
  <rect x="510" y="474" width="610" height="82" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="526" y="496" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">When Multi-point is selected, point list is editable here:</text>
  <text x="526" y="517" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">(-100,-100) (-50,-40) (0,0) (50,40) (100,100)</text>
  <text x="526" y="538" fill="#64748B" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Add, remove, and edit points directly.</text>
  <rect x="1132" y="474" width="146" height="34" rx="8" fill="#111827"/><text x="1169" y="496" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Apply values</text>
  <rect x="1132" y="518" width="146" height="34" rx="8" fill="#334155"/><text x="1168" y="540" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Save profile</text>

  <rect x="492" y="594" width="902" height="232" rx="12" fill="#0B1220"/>
  <text x="510" y="622" fill="#E2E8F0" font-family="Bahnschrift, Segoe UI, Arial" font-size="16" font-weight="700">Conflict and output preview</text>
  <text x="510" y="646" fill="#A5B4FC" font-family="Consolas, Courier New, monospace" font-size="12">Potential conflict: FA-18C_hornet JOY_Z already bound</text>
  <text x="510" y="666" fill="#E2E8F0" font-family="Consolas, Courier New, monospace" font-size="12">Action options: keep existing, overwrite, keep both</text>
  <text x="510" y="688" fill="#94A3B8" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Multiple modifiers are supported per bind, with mode ANY or ALL and custom order.</text>
  <rect x="510" y="706" width="160" height="36" rx="9" fill="#16A34A"/><text x="555" y="729" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="13" font-weight="700">Save bind</text>
  <rect x="680" y="706" width="160" height="36" rx="9" fill="#F59E0B"/><text x="724" y="729" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="13" font-weight="700">Open conflict</text>
  <rect x="850" y="706" width="160" height="36" rx="9" fill="#475569"/><text x="892" y="729" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="13">Merge profile</text>
  <rect x="1020" y="706" width="160" height="36" rx="9" fill="#111827"/><text x="1062" y="729" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="13" font-weight="700">Save profile</text>
  <rect x="1190" y="706" width="160" height="36" rx="9" fill="#0EA5E9"/><text x="1237" y="729" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="13" font-weight="700">Go to export</text>
  <text x="510" y="772" fill="#CBD5E1" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Create modifier adds to library only. Attach action links selected library modifiers to this bind.</text>

  <rect x="20" y="850" width="1400" height="38" rx="12" fill="#0F172A"/>
  <text x="44" y="874" fill="#CBD5E1" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Workflow bar: click any stage to jump back and forth.</text>
  <rect x="370" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="410" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Start</text>
  <rect x="500" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="531" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Relations</text>
  <rect x="630" y="856" width="124" height="26" rx="8" fill="#0EA5E9"/><text x="670" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Binds</text>
  <rect x="760" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="788" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Layout Optional</text>
  <rect x="890" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="931" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Export</text>
  <rect x="1020" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="1055" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Settings</text>
