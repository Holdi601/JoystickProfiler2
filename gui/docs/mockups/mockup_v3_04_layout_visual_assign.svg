<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#F4F6FA"/>

  <rect x="24" y="20" width="1392" height="96" rx="18" fill="#0F172A"/>
  <text x="56" y="66" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="30" font-weight="700">Step 4: Layout Editor (optional)</text>
  <text x="56" y="92" fill="#CBD5E1" font-family="Bahnschrift, Segoe UI, Arial" font-size="16">Place control ids on a joystick background image. Visual Assign mode and image export use these anchor positions.</text>
  <rect x="1276" y="34" width="114" height="32" rx="8" fill="#0EA5E9"/>
  <text x="1296" y="54" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Theme: Light</text>

  <rect x="24" y="136" width="392" height="700" rx="16" fill="#FFFFFF"/>
  <text x="48" y="176" fill="#0F172A" font-family="Bahnschrift, Segoe UI, Arial" font-size="22" font-weight="700">Layout controls</text>

  <text x="48" y="206" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="13" font-weight="700">Source</text>
  <rect x="48" y="214" width="328" height="36" rx="8" fill="#F8FAFC"/>
  <text x="64" y="237" fill="#64748B" font-family="Bahnschrift, Segoe UI, Arial" font-size="13">Select joystick background image or .layout file</text>
  <rect x="48" y="258" width="156" height="34" rx="8" fill="#111827"/>
  <text x="94" y="280" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Load image</text>
  <rect x="220" y="258" width="156" height="34" rx="8" fill="#0EA5E9"/>
  <text x="258" y="280" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Load layout</text>

  <rect x="48" y="304" width="328" height="98" rx="12" fill="#EEF2FF"/>
  <text x="64" y="330" fill="#1E293B" font-family="Bahnschrift, Segoe UI, Arial" font-size="14" font-weight="700">Placement mode</text>
  <rect x="66" y="344" width="18" height="18" rx="4" fill="#0EA5E9"/><text x="92" y="358" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="13">Add or move marker</text>
  <rect x="66" y="368" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8"/><text x="92" y="382" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="13">Remove marker</text>
  <text x="64" y="396" fill="#64748B" font-family="Bahnschrift, Segoe UI, Arial" font-size="11">Right click removes selected marker.</text>

  <text x="48" y="426" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="13" font-weight="700">Control selector</text>
  <rect x="48" y="434" width="328" height="36" rx="8" fill="#F8FAFC"/>
  <text x="64" y="457" fill="#64748B" font-family="Bahnschrift, Segoe UI, Arial" font-size="13">Search control id: BTN, AXIS, POV, modifiers</text>
  <rect x="48" y="476" width="328" height="168" rx="12" fill="#F8FAFC"/>
  <text x="64" y="500" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">JOY_BTN1</text>
  <text x="64" y="520" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">JOY_BTN2</text>
  <text x="64" y="540" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">JOY_Z</text>
  <text x="64" y="560" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">POV1_UP</text>
  <text x="64" y="580" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">ShiftLayer+JOY_BTN3</text>
  <rect x="64" y="612" width="174" height="20" rx="10" fill="#E0F2FE"/><text x="96" y="626" fill="#0369A1" font-family="Bahnschrift, Segoe UI, Arial" font-size="10" font-weight="700">selected: JOY_BTN1</text>

  <rect x="48" y="656" width="328" height="86" rx="12" fill="#ECFDF5"/>
  <text x="64" y="682" fill="#166534" font-family="Bahnschrift, Segoe UI, Arial" font-size="13" font-weight="700">Result</text>
  <text x="64" y="704" fill="#166534" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Layout stores control id + x/y position only.</text>
  <text x="64" y="722" fill="#166534" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">No relation names are stored in layout file.</text>

  <rect x="48" y="752" width="156" height="34" rx="8" fill="#111827"/>
  <text x="94" y="774" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Save layout</text>
  <rect x="220" y="752" width="156" height="34" rx="8" fill="#334155"/>
  <text x="258" y="774" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Open image export</text>

  <rect x="436" y="136" width="980" height="700" rx="16" fill="#FFFFFF"/>
  <text x="462" y="176" fill="#0F172A" font-family="Bahnschrift, Segoe UI, Arial" font-size="22" font-weight="700">Canvas preview</text>

  <rect x="462" y="194" width="928" height="130" rx="12" fill="#EEF2FF"/>
  <text x="484" y="222" fill="#1E293B" font-family="Bahnschrift, Segoe UI, Arial" font-size="17" font-weight="700">Label style</text>
  <text x="484" y="248" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Font</text>
  <rect x="522" y="234" width="210" height="28" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="540" y="252" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Bahnschrift</text>
  <text x="748" y="248" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Size</text>
  <rect x="782" y="234" width="60" height="28" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="804" y="252" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">11</text>
  <text x="858" y="248" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Color</text>
  <rect x="894" y="234" width="112" height="28" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="914" y="252" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">#FFFFFF</text>
  <text x="1022" y="248" fill="#334155" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Outline</text>
  <rect x="1070" y="234" width="112" height="28" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1090" y="252" fill="#334155" font-family="Consolas, Courier New, monospace" font-size="12">#111827</text>
  <rect x="1200" y="234" width="140" height="28" rx="8" fill="#111827"/><text x="1236" y="252" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Apply style</text>

  <rect x="462" y="338" width="928" height="478" rx="12" fill="#0B1220"/>
  <rect x="492" y="368" width="868" height="418" rx="12" fill="#111827"/>
  <text x="516" y="396" fill="#E2E8F0" font-family="Bahnschrift, Segoe UI, Arial" font-size="14">Joystick background image preview</text>

  <circle cx="660" cy="490" r="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <circle cx="660" cy="490" r="3" fill="#0EA5E9"/>
  <rect x="678" y="478" width="112" height="24" rx="6" fill="#0EA5E9"/><text x="706" y="494" fill="#FFFFFF" font-family="Consolas, Courier New, monospace" font-size="11" font-weight="700">JOY_BTN1</text>
  <circle cx="860" cy="560" r="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="860" cy="560" r="3" fill="#F59E0B"/>
  <rect x="878" y="548" width="96" height="24" rx="6" fill="#F59E0B"/><text x="904" y="564" fill="#FFFFFF" font-family="Consolas, Courier New, monospace" font-size="11" font-weight="700">JOY_Z</text>
  <circle cx="990" cy="636" r="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <circle cx="990" cy="636" r="3" fill="#16A34A"/>
  <rect x="1008" y="624" width="110" height="24" rx="6" fill="#16A34A"/><text x="1032" y="640" fill="#FFFFFF" font-family="Consolas, Courier New, monospace" font-size="11" font-weight="700">POV1_UP</text>

  <text x="516" y="762" fill="#94A3B8" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">This layout is reused by Visual Assign mode on the main binds surface.</text>

  <rect x="20" y="850" width="1400" height="38" rx="12" fill="#0F172A"/>
  <text x="44" y="874" fill="#CBD5E1" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Workflow bar: click any stage to jump back and forth.</text>
  <rect x="370" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="410" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Start</text>
  <rect x="500" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="531" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Relations</text>
  <rect x="630" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="670" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Binds</text>
  <rect x="760" y="856" width="124" height="26" rx="8" fill="#0EA5E9"/><text x="788" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12" font-weight="700">Layout Optional</text>
  <rect x="890" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="931" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Export</text>
  <rect x="1020" y="856" width="124" height="26" rx="8" fill="#334155"/><text x="1055" y="874" fill="#FFFFFF" font-family="Bahnschrift, Segoe UI, Arial" font-size="12">Settings</text>
</svg>
