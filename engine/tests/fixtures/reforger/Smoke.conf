ActionManager {
 Actions {
  Action CharacterFire {
   InputSource InputSourceSum "{0000000000000001}" {
    Sources {
     InputSourceValue "{0000000000010000}" {
      FilterPreset "hold"
      Input "joystick0:button0"
     }
    }
   }
  }
  Action HelicopterCyclicForward {
   InputSource InputSourceSum "{0000000000000002}" {
    Sources {
     InputSourceValue "{0000000000020000}" {
      FilterPreset "forward"
      Input "joystick0:axis1-"
     }
    }
   }
  }
  Action HelicopterCyclicBack {
   InputSource InputSourceSum "{0000000000000003}" {
    Sources {
     InputSourceValue "{0000000000030000}" {
      FilterPreset "back"
      Input "joystick0:axis1+"
     }
    }
   }
  }
  Action HelicopterAutohoverToggle {
   InputSource InputSourceSum "{0000000000000004}" {
    Sources {
     InputSourceValue "{0000000000040000}" {
      FilterPreset "click"
      Input "joystick0:button1"
     }
    }
   }
  }
  Action HelicopterEngineStart {
   InputSource InputSourceSum "{0000000000000005}" {
    Sources {
     InputSourceValue "{0000000000050000}" {
      FilterPreset "hold"
      Input "joystick1:button17"
      Filter InputFilterHold "{00000000FF050000}" {
      }
     }
    }
   }
  }
 }
}
